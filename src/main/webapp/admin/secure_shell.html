<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">

<head>
    <meta th:replace="~{_res/inc/header}">
    <script th:src="@{/_res/js/terminal-output.js}"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/

        $(document).ready(function () {

            $.ajaxSetup({cache: false});

            //get instance id list from selected terminals
            function getActiveTermsInstanceIds() {
                var ids = [];
                $(".run_cmd_active").each(function (index) {
                    var id = $(this).attr("id").replace("run_cmd_", "");
                    ids.push(id);
                });
                return ids;
            }


            $('#upload_push_dialog').on('hidden.bs.modal', function () {
                $("#upload_push_frame").attr("src", "");
                $(this).removeClass('upload-form-state');
            });

            $('#upload_push_frame').on('load', function () {
                var frameBody = this.contentDocument && this.contentDocument.body;
                $('#upload_push_dialog').toggleClass('upload-form-state',
                    frameBody != null && frameBody.classList.contains('upload-form-page'));
            });

            $(".termwrapper").sortable({
                connectWith: ".run_cmd",
                handle: ".term-header",
                zIndex: 10000,
                helper: 'clone',
                cancel: '.ui-resizable-handle'
            });

            //submit
            $(".submit_btn").click(function () {
                [# th:if= "${pendingSystemStatus != null && pendingSystemStatus.id != null}"]
                    $(this).parents('.modal').find('form').submit();
                [/]
                $(this).parents('.modal').modal('hide');
            });

            //close all forms
            $(".cancel_btn").click(function () {
                window.location = 'getNextPendingSystemForTerms.ktrl?pendingSystemStatus.id=' + /*[[${pendingSystemStatus.id}]]*/ ''
                    [# th:if= "${script != null && script.id > 0}"]
                        +'&script.id=' + /*[[${script.id}]]*/ ''
                    [/]
                    + '&_csrf=' + [[${session._csrf}]];
            });

            //disconnect terminals and remove from view
            $('#disconnect').click(function () {
                var ids = getActiveTermsInstanceIds();
                for (var i = 0; i < ids.length; i++) {
                    var id = ids[i];
                    $.ajax({
                        url: '../admin/disconnectTerm.ktrl?id=' + id + '&_csrf=' + [[${session._csrf}]],
                        cache: false
                    });
                    $('#run_cmd_' + id).remove();
                    if (termMap[id]) termMap[id].dispose();
                    delete termMap[id];
                    delete fitMap[id];
                    delete outputFilters[id];
                }
                updateTerminalSelection();
                resetSize();
                focusSelectedTerminal();
            });

            //select all
            $('#select_all').click(function (event) {
                event.preventDefault();
                $(".run_cmd").addClass('run_cmd_active');
                updateTerminalSelection();
                focusSelectedTerminal();
            });


            //upload frame dialog
            $('#upload_push').click(function () {


                var ids = [];
                $(".run_cmd_active").each(function (index) {
                    var id = $(this).find(".host").attr("data-bs-hostId");
                    if (ids.indexOf(id) === -1) {
                        ids.push(id);
                    }
                });

                var idListStr = '?_csrf=' + [[${session._csrf}]];
                ids.forEach(function (entry) {
                    idListStr = idListStr + '&idList=' + entry;
                });

                $('#upload_push_dialog').addClass('upload-form-state');
                $("#upload_push_frame").attr("src", "setUpload.ktrl" + idListStr);
                new bootstrap.Modal($("#upload_push_dialog")).show();
            });

            [# th:if= "${currentSystemStatus != null && (#strings.equals(currentSystemStatus.statusCd, 'GENERICFAIL') || #strings.equals(currentSystemStatus.statusCd, 'HOSTFAIL'))}"]
                new bootstrap.Modal($("#error_dialog")).show();
            [/]
            [# th:if= "${pendingSystemStatus != null && pendingSystemStatus.id != null && (currentSystemStatus == null || (!#strings.equals(currentSystemStatus.statusCd, 'GENERICFAIL') && !#strings.equals(currentSystemStatus.statusCd, 'HOSTFAIL')) )}"]
                [# th:if= "${ #strings.equals(pendingSystemStatus.statusCd, 'AUTHFAIL')}"]
                    new bootstrap.Modal($("#set_password_dialog")).show();
                [/]

                [# th:if= "${#strings.equals(pendingSystemStatus.statusCd, 'KEYAUTHFAIL')}"]
                    new bootstrap.Modal($("#set_passphrase_dialog")).show();
                [/]

                [# th:if= "${currentSystemStatus == null || (!#strings.equals(pendingSystemStatus.statusCd, 'AUTHFAIL') && !#strings.equals(pendingSystemStatus.statusCd, 'KEYAUTHFAIL')&& !#strings.equals(pendingSystemStatus.statusCd, 'GENERICFAIL'))}"]
                    $("#composite_terms_frm").submit();
                [/]
            [/]

            [# th:if= "${pendingSystemStatus == null || pendingSystemStatus.id == null}"]



            function getSelectedTerminalText() {
                if (selectionTermId && termMap[selectionTermId]
                    && termMap[selectionTermId].hasSelection()) {
                    return termMap[selectionTermId].getSelection();
                }

                var ids = Object.keys(termMap || {});
                for (var i = 0; i < ids.length; i++) {
                    if (termMap[ids[i]].hasSelection()) {
                        selectionTermId = ids[i];
                        return termMap[ids[i]].getSelection();
                    }
                }
                return '';
            }

            function sendToActiveTerminals(message) {
                var ids = getActiveTermsInstanceIds();
                if (!ids.length || !connection || connection.readyState !== WebSocket.OPEN) {
                    return false;
                }

                message.id = ids;
                connection.send(JSON.stringify(message));
                return true;
            }


            function updateTerminalSelection() {
                var count = getActiveTermsInstanceIds().length;
                $('#terminal-selection').text(count + ' of ' + $('.run_cmd').length + ' selected');
                $('#terminal-empty').prop('hidden', $('.run_cmd').length !== 0);
                $('#dup_session, #disconnect, #upload_push').toggleClass('disabled', count === 0)
                    .attr('aria-disabled', String(count === 0));
            }

            function focusSelectedTerminal() {
                var ids = getActiveTermsInstanceIds();
                var id = ids.indexOf(focusedTermId) !== -1 ? focusedTermId : ids[0];
                if (id && termMap[id]) termMap[id].focus();
            }

            $(document).on('copy', function (e) {
                if ($('body').hasClass('modal-open') || !$(e.target).closest('.xterm').length) return;
                var selectedText = getSelectedTerminalText();
                var clipboard = e.originalEvent && e.originalEvent.clipboardData;
                if (!selectedText || !clipboard) {
                    return;
                }

                clipboard.setData('text/plain', selectedText);
                e.preventDefault();
                if (selectionTermId && termMap[selectionTermId]) {
                    termMap[selectionTermId].clearSelection();
                }
                selectionTermId = null;
            });

            var termMap = {};
            var fitMap = {};
            var ptyResizeRequests = {};
            var selectionTermId = null;
            var focusedTermId = null;

            var outputFilters = {};

            $("#reset_size").click(function () {
                resetSize();
            });

            function resetSize() {
                var wrapper = document.querySelector('.live-term-container .termwrapper');
                if (!wrapper || !$('.run_cmd').length) return;
                // Match the audit terminal height; extra rows scroll with the page.
                var outputHeight = 320;
                var ids = [];
                $(".run_cmd").each(function () {
                    ids.push($(this).attr("id").replace("run_cmd_", ""));
                });
                for (var i = 0; i < ids.length; i++) {
                    var output = $("#output_" + ids[i]);
                    output.closest(".run_cmd").css({
                        "width": "100%",
                        "height": "auto"
                    });
                    output.css("width", "100%");
                    output.height(outputHeight);
                    resize(output);
                }
            }

            var windowResizeTimer;
            $(window).on('resize', function (event) {
                // jQuery UI's terminal-card resize event can bubble to window.
                // Treat only a genuine browser viewport resize as a layout reset.
                if (event.target !== window) {
                    return;
                }
                clearTimeout(windowResizeTimer);
                windowResizeTimer = setTimeout(resetSize, 120);
            });

            //resize element during drag event. Makes call to set pty width and height
            function resize(element) {
                var id = element.attr("id").replace("output_", "");

                if (termMap[id]) {
                    // Fit first, then give the remote PTY xterm's exact character grid.
                    // Estimating columns from pixels causes wrapping disagreements that
                    // make zsh display its inverse-video PROMPT_EOL_MARK (usually "%").
                    fitMap[id].fit();

                    // Use the rendered screen rather than the card dimensions so the PTY
                    // remains exact when terminal padding or chrome changes.
                    var screen = termMap[id].element.querySelector('.xterm-screen');
                    var bounds = screen ? screen.getBoundingClientRect() : null;
                    var width = Math.max(1, Math.floor(bounds ? bounds.width : element.innerWidth()));
                    var height = Math.max(1, Math.floor(bounds ? bounds.height : element.innerHeight()));

                    if (ptyResizeRequests[id]) {
                        ptyResizeRequests[id].abort();
                    }
                    var request = $.ajax({
                        url: '../admin/setPtyType.ktrl',
                        method: 'GET',
                        data: {
                            id: id,
                            'userSettings.ptyColumns': termMap[id].cols,
                            'userSettings.ptyRows': termMap[id].rows,
                            'userSettings.ptyWidth': width,
                            'userSettings.ptyHeight': height,
                            _csrf: [[${session._csrf}]]
                        },
                        cache: false
                    });
                    ptyResizeRequests[id] = request;
                    request.always(function () {
                        if (ptyResizeRequests[id] === request) {
                            delete ptyResizeRequests[id];
                        }
                    });
                }

            }

            var loc = window.location, ws_uri;
            if (loc.protocol === "https:") {
                ws_uri = "wss:";
            } else {
                ws_uri = "ws:";
            }
            ws_uri += "//" + loc.host + loc.pathname + '/../terms.ws?t=' + new Date().getTime();

            var connection = new WebSocket(ws_uri);

            function heartbeat() {
                if (!connection) return;
                if (connection.readyState !== 1) return;
                connection.send("heartbeat");

                // Set heartbeat interval 10,000 ms
                setTimeout(heartbeat, 10000);
            }

            // Register websocket heartbeat
            connection.onopen = function (e) {
                heartbeat();
                $("#terminal-connection").text("Connected");
            };

            // Log errors
            connection.onerror = function (error) {
                $('#terminal-connection').text('Connection error — exit and reconnect').addClass('error');
            };

            connection.onclose = function () {
                $('#terminal-connection').text('Disconnected — exit and reconnect').addClass('error');
            };

            // Log messages from the server
            connection.onmessage = function (e) {
                var json = JSON.parse(e.data);
                $.each(json, function (key, val) {
                    if (val.output != '') {
                        if (!outputFilters[val.instanceId]) outputFilters[val.instanceId] = createBastillionOutputFilter();
                        val.output = outputFilters[val.instanceId](val.output);
                        if (!val.output) return;
                        if (!termMap[val.instanceId]) {
                            createTermMap(val.instanceId, val.output);
                            resetSize();
                        } else {
                            termMap[val.instanceId].write(val.output);
                        }
                    }

                });
            };

            function createTermMap(id, output) {

                var  CUSTOM_THEME =
                    {
                    [# th:if= "${userSettings != null && userSettings.bg != null}"]
                        background: [[${userSettings.bg}]],
                        cursorAccent: [[${userSettings.bg}]],
                    [/]
                    [# th:if= "${userSettings != null && userSettings.fg != null}"]
                        foreground: [[${userSettings.fg}]],
                        cursor: [[${userSettings.fg}]],
                    [/]
                    [# th:if= "${userSettings !=null && userSettings.colors != null && userSettings.colors.length == 16}"]
                        black: [[${userSettings.colors[0]}]],
                        red: [[${userSettings.colors[1]}]],
                        green: [[${userSettings.colors[2]}]],
                        yellow: [[${userSettings.colors[3]}]],
                        blue: [[${userSettings.colors[4]}]],
                        magenta: [[${userSettings.colors[5]}]],
                        cyan: [[${userSettings.colors[6]}]],
                        white: [[${userSettings.colors[7]}]],
                        brightBlack: [[${userSettings.colors[8]}]],
                        brightRed: [[${userSettings.colors[9]}]],
                        brightGreen: [[${userSettings.colors[10]}]],
                        brightYellow: [[${userSettings.colors[11]}]],
                        brightBlue: [[${userSettings.colors[12]}]],
                        brightMagenta: [[${userSettings.colors[13]}]],
                        brightCyan: [[${userSettings.colors[14]}]],
                        brightWhite: [[${userSettings.colors[15]}]]
                    [/]
                    };

                var terminalBackground = CUSTOM_THEME.background || '#070a0e';
                var terminalForeground = CUSTOM_THEME.foreground || '#e6edf3';
                var terminalCard = $("#run_cmd_" + id);
                terminalCard.css({
                    '--terminal-bg': terminalBackground,
                    '--terminal-fg': terminalForeground
                });
                terminalCard.find('.term').css('background-color', terminalBackground);

                termMap[id] = new Terminal({
                    fontSize: 14,
                    lineHeight: 1.2,
                    letterSpacing: 0,
                    'theme': CUSTOM_THEME,
                    'cursorStyle' : 'block',
                    'cursorBlink' : true,
                    'cursorInactiveStyle' : 'outline',
                    fontFamily: 'SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace'
                });

                fitMap[id] = new FitAddon.FitAddon()
                termMap[id].loadAddon(fitMap[id])

                termMap[id].open($("#run_cmd_" + id).find('.terminal-viewport').get(0));
                termMap[id].attachCustomKeyEventHandler(function (event) {
                    var copyShortcut = event.type === 'keydown' && !event.altKey
                        && (event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'c';
                    if (copyShortcut && termMap[id].hasSelection()) return false;
                    // Preserve the legacy multiplex interrupt explicitly; copy with a
                    // selection still belongs to the clipboard, never the remote shell.
                    if (event.type === 'keydown' && event.ctrlKey && !event.altKey && !event.metaKey
                        && event.key.toLowerCase() === 'c') {
                        event.preventDefault();
                        sendToActiveTerminals({keyCode: 67});
                        return false;
                    }
                    return true;
                });
                termMap[id].onData(function (data) {
                    sendToActiveTerminals({command: data});
                });
                $(termMap[id].textarea).on('focus', function () {
                    focusedTermId = String(id);
                });
                termMap[id].onSelectionChange(function () {
                    if (termMap[id].hasSelection()) {
                        selectionTermId = String(id);
                    }
                });

                var blinkingBlockCursor = '\x1b[1 q';
                termMap[id].write(output + blinkingBlockCursor, function () {
                    // xterm does not initialize its cursor until the first focus or key
                    // event. Prime it after the prompt is parsed. Keep the first pane
                    // focused and restore the user's current pane as others initialize.
                    var previousFocusedTermId = focusedTermId;
                    termMap[id].focus();
                    termMap[id].refresh(0, termMap[id].rows - 1);
                    if (previousFocusedTermId === null) {
                        focusedTermId = String(id);
                    } else if (previousFocusedTermId !== String(id)
                        && termMap[previousFocusedTermId]) {
                        termMap[id].blur();
                        termMap[previousFocusedTermId].focus();
                    }
                });


            }

            //function to set all terminal bindings when creating a term window
            function setTerminalEvents(element) {

                //if terminal window toggle active for commands
                element.mousedown(function (e) {
                    if ($(e.target).hasClass("ui-resizable-handle")) {
                        return;
                    }
                    //check for cmd-click / ctr-click
                    if (!e.ctrlKey && !e.metaKey) {
                        $(".run_cmd").removeClass('run_cmd_active');
                    }

                    if (element.hasClass('run_cmd_active')) {
                        element.removeClass('run_cmd_active');
                    } else {
                        element.addClass('run_cmd_active')
                    }
                    updateTerminalSelection();
                });

                var id = element.attr("id").replace("run_cmd_", "");
                element.find('.term-header').on('click', function () {
                    focusSelectedTerminal();
                });
                element.find(".output").on('mouseup', function () {
                    var terminal = termMap[id];
                    if (terminal && terminal.hasSelection()) {
                        selectionTermId = id;
                    }
                });

                // Resize the complete terminal card. Resizing only .output lets
                // jQuery UI restore the parent grid item to its stretched width when
                // the drag ends, which makes the terminal appear to snap back.
                var output = element.find(".output");
                var terminalChromeHeight = element.outerHeight() - output.outerHeight();
                element.resizable({
                    ghost: false,
                    handles: "e, s, se",
                    minWidth: 320,
                    minHeight: Math.max(180, terminalChromeHeight + 120),
                    start: function () {
                        element.addClass("term-resizing");
                        terminalChromeHeight = element.outerHeight() - output.outerHeight();
                    },
                    resize: function (event, ui) {
                        output.outerHeight(Math.max(120, ui.size.height - terminalChromeHeight));
                    },
                    stop: function (event, ui) {
                        output.outerHeight(Math.max(120, ui.size.height - terminalChromeHeight));
                        element.css("height", "auto");
                        element.removeClass("term-resizing");
                        // Wait for the grid and xterm viewport to expose their final
                        // dimensions, then fit xterm and send those exact rows/columns
                        // to ChannelShell.setPtySize on the server.
                        window.requestAnimationFrame(function () {
                            resize(output);
                        });
                    }
                });

                // jQuery UI normally infers the resize axis from mouseover. When
                // moving quickly from the terminal into a handle, that axis can be
                // stale (usually "s"), so a corner drag changes only the height.
                // Capture the handle that was actually pressed before jQuery UI's
                // bubbling mousedown handler starts the resize.
                element.get(0).addEventListener("mousedown", function (event) {
                    var handle = event.target.closest(".ui-resizable-handle");
                    if (!handle) {
                        return;
                    }
                    var axisMatch = handle.className.match(/ui-resizable-(se|sw|ne|nw|n|e|s|w)/);
                    var instance = element.resizable("instance");
                    if (axisMatch && instance) {
                        instance.axis = axisMatch[1];
                    }
                }, true);
            }

            //returns div for newly created terminal element
            function createTermElement(instanceId, hostId, displayLabel) {
                var instance =
                    "<div id=\"run_cmd_" + instanceId + "\" class=\"run_cmd_active run_cmd\">"
                    + "<h6 class=\"term-header\">" + displayLabel + "</h6>"
                    + "<div class=\"term\">"
                    + "<div id=\"output_" + instanceId + "\" class=\"output\">"
                    + "<div class=\"terminal-viewport\"></div>"
                    + "</div>"
                    + "</div>"
                    + "<div data-bs-hostId=\"" + hostId + "\" class=\"host\"></div>"
                    + "</div>";
                return instance;
            }

            // createSession.ktrl works off a per-user pending-system queue on the server
            // (SystemStatusDB.setInitialSystemStatus wipes and rebuilds it on every call,
            // rather than scoping it to one request), so two overlapping calls - e.g.
            // duplicating several different active terminals at once - can wipe out each
            // other's still-unprocessed queue entry before the server ever gets to it. One
            // host then never gets a session (its terminal box stays empty) while another
            // can get processed twice. Chaining every call through this one promise keeps
            // the server from ever seeing two createSession.ktrl requests in flight for this
            // user at once, without blocking the browser the way the old async:false did.
            var createSessionChain = $.when();

            //creates a new terminal element for hostId, wires up its events, inserts it via insertFn,
            //then asks the server to create the backing session
            function addTerminal(hostId, displayLabel, insertFn) {
                var newInstanceId = getNextInstanceId();

                insertFn($(createTermElement(newInstanceId, hostId, displayLabel)));

                setTerminalEvents($("#run_cmd_" + newInstanceId));
                updateTerminalSelection();
                resetSize();

                //call server to create instances. createSession.ktrl has no view, so its
                //response body is empty - $.getJSON forces JSON parsing and rejects on that
                //empty body even though the server-side call succeeded, which silently
                //broke this chain after the first request (every request after it just
                //never got sent). Plain $.ajax with no dataType lets jQuery see there's
                //nothing to parse instead of treating an empty body as a parse error.
                //Registering the same handler as both the success and failure callback
                //(rather than .then(fn) with no failure handler) also means one host
                //genuinely failing to connect can't stop every host queued after it in
                //the same batch from ever being requested.
                function fireCreateSession() {
                    return $.ajax({
                        url: '../admin/createSession.ktrl?systemSelectId=' + hostId + '&_csrf=' + [[${session._csrf}]],
                        cache: false
                    });
                }
                createSessionChain = createSessionChain.then(fireCreateSession, fireCreateSession);
            }

            //function clones terminals based on active
            $('#dup_session').click(function () {
                var instanceIds = getActiveTermsInstanceIds();
                for (var i = 0; i < instanceIds.length; i++) {
                    var instanceId = instanceIds[i];
                    var hostId = $('#run_cmd_' + instanceId).find(".host").attr("data-bs-hostId");
                    var displayLabel = $('#run_cmd_' + instanceId).find(".term-header").text();

                    addTerminal(hostId, displayLabel, function (element) {
                        element.insertAfter($('#run_cmd_' + instanceId));
                    });
                }

            });

            //function that connects to allocated hosts
            $('.connect_btn').click(function () {
                var hostId = $('#connectHostId').val();
                var displayLabel = $('#connectHostId option:selected').text();

                addTerminal(hostId, displayLabel, function (element) {
                    element.prependTo(".termwrapper");
                });

            });

            //returns next instance id
            function getNextInstanceId() {
                var newInstanceId = 1;

                for (var i = 1; i <= $('.run_cmd').length; i++) {

                    if ($("#run_cmd_" + i).length === 0) {
                        newInstanceId = i;
                        break;
                    }
                    newInstanceId++;
                }
                return newInstanceId;
            }

            //set connected systems
            [# th:each = "s : ${systemList}" ]
                $(createTermElement([[${s.instanceId}]], [[${s.id}]], [[${s.displayLabel}]])).appendTo(".termwrapper");
                setTerminalEvents($("#run_cmd_" + [[${s.instanceId}]]));
            [/]

            updateTerminalSelection();
            resetSize();
            [/]

        });

        /*]]>*/
    </script>

    <style>
        .terminal-toolbar { display: flex; align-items: center; gap: 18px; padding: 0 2px 14px; color: var(--bastillion-muted); font-size: .8rem; }
        #terminal-selection { color: var(--bastillion-accent); font-weight: 700; white-space: nowrap; }
        #terminal-connection { margin-left: auto; }
        .terminal-toolbar + [hidden] { display: none; }
        .live-term-container {
            width: calc(100% - 32px);
            max-width: none;
            min-width: 0;
            padding: 10px 0 32px;
            margin: 0 auto;
            overflow-x: hidden;
        }
        .live-term-container .termwrapper {
            display: grid;
            width: 100%;
            max-width: 100%;
            min-width: 0;
            margin: 0;
            box-sizing: border-box;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
            align-items: start;
        }
        .live-term-container .run_cmd {
            width: 100%;
            max-width: 100%;
            min-width: 0;
            margin: 0;
            float: none;
            justify-self: start;
            box-sizing: border-box;
        }
        .live-term-container .output {
            width: auto;
            max-width: 100%;
        }
        @media (max-width: 900px) {
            .live-term-container {
                width: calc(100% - 20px);
            }
            .live-term-container .termwrapper {
                grid-template-columns: minmax(0, 1fr);
            }
        }
    </style>
    <title>Bastillion - Terminals</title>
</head>
<body>
<template th:if="${(systemList != null && !systemList.empty) || pendingSystemStatus.id != null }"
          th:remove="tag">
    <div class="navbar navbar-dark fixed-top navbar-expand" role="navigation">
        <div class="container">
            <div class="navbar-brand">
                <img class="brand-logo" src="/img/bastillion-logo.svg" th:src="@{/img/bastillion-logo.svg}"
                     alt="Bastillion">
                <span>Bastillion</span>
            </div>
            <div class="navbar-collapse" id="navbarCollapse">
                <template th:if="${pendingSystemStatus == null || pendingSystemStatus.id == null}"
                          th:remove="tag">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item"><a id="select_all" href="#"
                                                title="Use CMD-Click or CTRL-Click to select multiple individual terminals"
                                                class="nav-link">Select

                            All</a>
                        </li>
                        <li class="dropdown nav-item"><a href="#" class="dropdown-toggle nav-link"
                                                         data-bs-toggle="dropdown">Terminal Actions<b
                                class="caret"></b></a>
                            <ul
                                    class="dropdown-menu">
                                <li><a id="upload_push" class="dropdown-item" href="#">Upload &amp; Push</a>
                                </li>
                                <li><a id="connect_to_host" class="dropdown-item" data-bs-toggle="modal"
                                                             data-bs-target="#connect_to_host_dialog"
                                                             href="#">Connect to Host</a>
                                </li>
                                <li><a id="dup_session" class="dropdown-item" href="#">Duplicate Session</a>
                                </li>
                                <li><a id="reset_size" class="dropdown-item" href="#">Reset Size</a>
                                </li>
                                <li><a id="disconnect" class="dropdown-item" href="#">Disconnect</a>
                                </li>
                            </ul>
                        </li>
                        <li class="nav-item"><a th:href="'exitTerms.ktrl?_csrf=' + ${session._csrf}"
                                                class="nav-link">Exit Terminals</a>
                        </li>
                    </ul>
                </template>
            </div>
            <!--/.nav-collapse -->
        </div>
    </div>
    <div class="term-container live-term-container container">
        <div class="terminal-toolbar">
            <span id="terminal-selection" role="status" aria-live="polite"></span>
            <span>Ctrl/Cmd-click to select multiple.</span>
            <span id="terminal-connection" role="status">Connecting…</span>
        </div>
        <div id="terminal-empty" class="empty-state" hidden><strong>No open terminals</strong><span>Use Terminal Actions → Connect to Host to start a session.</span></div>
        <div class="termwrapper"></div>
    </div>
</template>
<template th:if="${(systemList == null || systemList.empty) && pendingSystemStatus.id == null}"
          th:remove="tag">
    <div th:replace="~{_res/inc/navigation}"></div>
    <div class="container table-page">
        <h3>Terminals</h3>
        <p class="error">No sessions could be created</p>
    </div>
</template>
<div id="connect_to_host_dialog" class="modal fade">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Connect to Host</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <select id="connectHostId" class="host_frm_select form-select" name="connectHostId" title="Connect to Host">
                        <option th:each="s : ${allocatedSystemList}" th:value="${s.id}"
                                th:text="${s.displayLabel}"></option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-secondary connect_btn"
                        data-bs-dismiss="modal">Connect
                </button>
            </div>
        </div>
    </div>
</div>
<div id="set_password_dialog" class="modal fade">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h6 class="modal-title"
                    th:text="'Enter password for ' + ${pendingSystemStatus.displayLabel}"></h6>
                <button type="button" class="btn-close cancel_btn" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="error" th:if="${pendingSystemStatus.errorMsg != null}"
                         th:text="'Error: ' + ${pendingSystemStatus.errorMsg}"></div>
                    <form id="password_frm" th:action="@{/admin/createTerms.ktrl}" method="post">
                        <input type="hidden" name="_csrf" th:value="${session._csrf}">
                        <input type="hidden" name="pendingSystemStatus.id" th:value="${pendingSystemStatus.id}">
                        <table>
                            <tr>
                                <td>Password:
                                </td>
                                <td>
                                    <input type="password" name="password" class="form-control" title="Password" size="15" value=""
                                           autocomplete="off">
                                </td>
                            </tr>
                        </table>
                        <input type="hidden" name="script.id" th:if="${script != null}" th:value="${script.id}">
                    </form>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary cancel_btn" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-secondary submit_btn">Submit</button>
            </div>
        </div>
    </div>
</div>
<div id="set_passphrase_dialog" class="modal fade">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h6 class="modal-title"
                    th:text="'Enter passphrase for ' + ${pendingSystemStatus.displayLabel}"></h6>
                <button type="button" class="btn-close cancel_btn" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="error" th:if="${pendingSystemStatus.errorMsg != null}"
                         th:text="'Error: ' + ${pendingSystemStatus.errorMsg}"></div>
                    <form id="passphrase_frm" th:action="@{/admin/createTerms.ktrl}"
                          method="post">
                        <input type="hidden" name="_csrf" th:value="${session._csrf}">
                        <input type="hidden" name="pendingSystemStatus.id" th:value="${pendingSystemStatus.id}">
                        <table>
                            <tr>
                                <td>Password:
                                </td>
                                <td>
                                    <input type="password" name="passphrase" class="form-control" title="Passphrase" size="15"
                                           value="" autocomplete="off">
                                </td>
                            </tr>
                        </table>
                        <input type="hidden" name="script.id" th:if="${script != null}" th:value="${script.id}">
                    </form>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary cancel_btn" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-secondary submit_btn">Submit</button>
            </div>
        </div>
    </div>
</div>
<div id="error_dialog" class="modal fade">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h6 class="modal-title" th:text="'System: ' + ${currentSystemStatus.displayLabel}"></h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="error" th:if="${currentSystemStatus.errorMsg != null}"
                         th:text="'Error: ' + ${currentSystemStatus.errorMsg}"></div>
                    <form id="error_frm" th:action="@{/admin/createTerms.ktrl}" method="post">
                        <input type="hidden" name="_csrf" th:value="${session._csrf}">
                        <input type="hidden" name="pendingSystemStatus.id" th:value="${pendingSystemStatus.id}">
                        <input type="hidden" name="script.id" th:if="${script != null}" th:value="${script.id}">
                    </form>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary submit_btn">OK</button>
            </div>
        </div>
    </div>
</div>
<div id="upload_push_dialog" class="modal fade">
    <div class="modal-dialog modal-dialog-centered upload-push-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Upload &amp; Push</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body upload-push-modal-body">
                <iframe id="upload_push_frame" class="upload-push-frame" title="Upload and push files"></iframe>
            </div>
        </div>
    </div>
</div>
<form id="composite_terms_frm" th:action="@{/admin/createTerms.ktrl}"
      method="post">
    <input type="hidden" name="_csrf" th:value="${session._csrf}">
    <input type="hidden" name="pendingSystemStatus.id" th:value="${pendingSystemStatus.id}">
    <input type="hidden" name="script.id" th:if="${script != null}" th:value="${script.id}">
</form>
</body>

</html>
