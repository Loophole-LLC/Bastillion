<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">

<head>
    <meta th:replace="~{_res/inc/header}">
    <title>Bastillion - Login</title>

</head>

<body>
<div class="navbar navbar-dark fixed-top navbar-expand" role="navigation">
    <div class="container">
        <div class="navbar-brand">
            <img class="brand-logo" src="/img/bastillion-logo.svg" th:src="@{/img/bastillion-logo.svg}"
                 alt="Bastillion">
            <span>Bastillion</span>
        </div>
        <!--/.nav-collapse -->
    </div>
</div>
<main class="container login-wrap">
    <div class="card login-card">
        <div class="card-body">
            <div class="login-heading">
                <h1>Welcome back</h1>
                <p>Sign in to manage systems and SSH sessions.</p>
            </div>
            <div th:replace="~{_res/inc/errors}"></div>
            <form id="loginSubmit" th:action="@{/loginSubmit.ktrl}" method="post"
                  autocomplete="off">
                <div class="mb-3">
                    <label class="form-label" for="login-username">Username</label>
                    <input type="text" id="login-username" autofocus name="auth.username" autocomplete="username" autocapitalize="none" spellcheck="false" class="form-control" title="Username">
                    <span class="error" th:text="${fieldErrors.get('auth.username')}"></span>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="login-password">Password</label>
                    <input type="password" id="login-password" name="auth.password" autocomplete="current-password" class="form-control" title="Password">
                    <span class="error" th:text="${fieldErrors.get('auth.password')}"></span>
                </div>
                <div class="mb-3" th:if="${otpEnabled}">
                    <label class="form-label" for="login-otpToken">OTP Access Code</label>
                    <input type="text" id="login-otpToken" name="auth.otpToken" autocomplete="one-time-code" inputmode="numeric" aria-describedby="otp-help" class="form-control" title="OTP Access Code">
                    <div id="otp-help" class="form-text">Enter your authenticator code if two-factor authentication is set up.</div>
                    <span class="error" th:text="${fieldErrors.get('auth.otpToken')}"></span>
                </div>
                <button type="submit" id="login_btn" class="btn btn-secondary w-100">Sign in <span aria-hidden="true">↗</span></button>
                <input type="hidden" name="_csrf" th:value="${session._csrf}">
            </form>
            <template th:if="${samlEnabled}" th:remove="tag">
                <div class="text-center text-muted my-2">or</div>
                <a id="saml_login_btn" class="btn btn-outline-secondary w-100"
                   th:href="'/samlLogin.ktrl?_csrf=' + ${session._csrf}">Sign in with SSO</a>
            </template>
        </div>
    </div>
</main>
</body>

</html>
