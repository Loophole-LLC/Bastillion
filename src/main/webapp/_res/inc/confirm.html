<div id="confirm_dialog" class="modal fade" tabindex="-1" aria-labelledby="confirm_title" aria-describedby="confirm_message"
     xmlns:th="http://www.thymeleaf.org">
    <div class="modal-dialog modal-dialog-centered confirm-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="confirm_title">Confirm</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p id="confirm_message"></p>
            </div>
            <div class="modal-footer">
                <button type="button" id="confirm_cancel_btn" class="btn btn-secondary edit_btn"
                        data-bs-dismiss="modal">Cancel
                </button>
                <button type="button" id="confirm_btn" class="btn btn-danger">Delete</button>
            </div>
        </div>
    </div>
</div>
