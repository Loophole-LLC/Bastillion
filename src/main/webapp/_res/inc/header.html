<head xmlns:th="http://www.thymeleaf.org" th:remove="tag">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta id="theme-color" name="theme-color" content="#080b10"/>
    <script>
        // Apply the saved preference before styles load to avoid a light/dark flash.
        (function () {
            var match = document.cookie.match(/(?:^|;\s*)bastillion_theme=(dark|light)(?:;|$)/);
            var theme = match ? match[1] : 'dark';
            document.documentElement.setAttribute('data-bs-theme', theme);
            document.getElementById('theme-color').setAttribute(
                'content', theme === 'light' ? '#f4f7f5' : '#080b10');
        }());
    </script>

    <link rel="icon" th:href="@{/img/bastillion-logo.svg}" type="image/svg+xml"/>
    <link rel="stylesheet" type="text/css" th:href="@{/_res/node/css/jquery-ui/all.css}"/>
    <link rel="stylesheet" type="text/css" th:href="@{/_res/node/css/xterm.css}"/>
    <!-- bootstrap.min.css already contains reboot, grid and utilities -->
    <link rel="stylesheet" type="text/css" th:href="@{/_res/node/css/bootstrap.min.css}"/>
    <link rel="stylesheet" type="text/css" th:href="@{/_res/css/bastillion.css}"/>
    <!-- Core libraries -->
    <script th:src="@{/_res/node/js/jquery.min.js}"></script>
    <script th:src="@{/_res/node/js/popper.min.js}"></script>
    <script th:src="@{/_res/node/js/bootstrap.min.js}"></script>

    <!-- jQuery UI core: only what sortable and resizable depend on -->
    <script th:src="@{/_res/node/js/jquery-ui/version.js}"></script>
    <script th:src="@{/_res/node/js/jquery-ui/widget.js}"></script>
    <script th:src="@{/_res/node/js/jquery-ui/data.js}"></script>
    <script th:src="@{/_res/node/js/jquery-ui/disable-selection.js}"></script>
    <script th:src="@{/_res/node/js/jquery-ui/plugin.js}"></script>
    <script th:src="@{/_res/node/js/jquery-ui/scroll-parent.js}"></script>

    <!-- jQuery UI Widgets -->
    <script th:src="@{/_res/node/js/jquery-ui/widgets/mouse.js}"></script>
    <script th:src="@{/_res/node/js/jquery-ui/widgets/resizable.js}"></script>
    <script th:src="@{/_res/node/js/jquery-ui/widgets/sortable.js}"></script>

    <!-- Extra libs -->
    <script th:src="@{/_res/node/js/jquery.floatThead.min.js}"></script>
    <script th:src="@{/_res/node/js/xterm.js}"></script>
    <script th:src="@{/_res/node/js/addon-fit.js}"></script>


    <script th:inline="javascript">
        /*<![CDATA[*/
        $(document).ready(function () {

            $.ajaxSetup({cache: false});

            // Keep parent sections active on assignment and edit screens too.
            var navigationPath = window.location.pathname;
            if (/^\/manage\/.*Profile(Systems|Users)/.test(navigationPath)) navigationPath = '/manage/viewProfiles.ktrl';
            // Match the path without the rotating CSRF query parameter.
            $('.navbar a[href]').each(function () {
                if (this.getAttribute('href') === '#' || this.pathname !== navigationPath) return;
                if ($(this).hasClass('navbar-brand')) return;
                $(this).addClass('active').attr('aria-current', 'page');
                $(this).closest('.dropdown').children('.nav-link').addClass('active');
            });

            // Keep Enter-to-submit for text fields, with native form validation.
            $('form input:not([type="checkbox"]):not([type="radio"]):not([type="file"]):not([type="submit"]):not([type="button"])').on('keydown', function (event) {
                if (event.key === 'Enter' && !event.isComposing && !event.originalEvent?.isComposing) {
                    event.preventDefault();
                    this.form.requestSubmit();
                }
            });

            // Native buttons make column sorting available to keyboard users.
            $('th.sort').each(function () {
                $(this).attr({'scope': 'col', 'aria-sort': 'none'})
                    .wrapInner('<button type="button" class="table-sort-label"></button>');
            });

            $('[data-theme-toggle]').on('change', function () {
                var theme = this.checked ? 'dark' : 'light';
                $('#ui-theme-value').val(theme);
                document.documentElement.setAttribute('data-bs-theme', theme);
                $('#theme-color').attr('content', theme === 'light' ? '#f4f7f5' : '#080b10');
            });

            var scrollWrapper = $('.scrollWrapper');
            if (scrollWrapper.height() >= 450) {
                scrollWrapper.addClass('scrollWrapperActive');
                $('.scrollableTable').floatThead({
                    scrollContainer: function ($table) {
                        return $table.closest(".scrollWrapper");
                    }
                });
            }

            $('input[autofocus]:enabled:visible').first().trigger('focus');

            $('.modal').on('shown.bs.modal', function () {
                $(this).find('input:enabled:visible:first').focus();
            });

            // Prevent duplicate submissions without changing every button on the page.
            // Disabling all .btn elements caused unrelated actions to flash into
            // Bootstrap's disabled colors while a form was navigating away.
            $("form").submit(function (event) {
                var form = $(this);
                if (form.data("submitting")) {
                    return false;
                }

                form.data("submitting", true);
                var submitter = event.originalEvent && event.originalEvent.submitter;
                if (submitter) {
                    $(submitter).prop("disabled", true);
                }
                return true;
            }).attr("accept-charset", "utf-8");
        });

        //break if loaded in frame
        [# th:if="${isFrame == null || !isFrame}"]
            if (top !== self) top.location.replace(self.location.href);
        [/]
        /*]]>*/
    </script>

</head>
