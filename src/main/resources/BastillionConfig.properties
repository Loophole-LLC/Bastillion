#
# Bastillion Configuration Options
#
# Every property here can also be set as an environment variable instead: take the property
# name and insert an underscore before each capital letter, then uppercase it (e.g.
# sshKeyType -> SSH_KEY_TYPE, dbUser -> DB_USER). Env vars always win over this file - the
# recommended way to configure Bastillion, especially in containers.
#

### Application SSH Key (the key pair Bastillion itself uses to authenticate to every managed system) ###
#One-shot trigger: set to true and restart to force-regenerate (or re-import, if
#privateKey/publicKey below are set) Bastillion's own global SSH key pair. Bastillion resets
#this back to false automatically once it's done, so it's not a persistent mode - only use it
#to rotate the key (e.g. after a suspected compromise) or to import a specific key pair.
#Always forced to true on a brand-new install's first boot, regardless of this setting, since
#that's how the very first key pair gets created.
resetApplicationSSHKey=false
#Key type for the application SSH key pair described above, and the default offered to users
#generating their own personal keys. Supported options:
#   rsa     - Classic, widely compatible (bit length set by sshKeyLength below, default 4096)
#   ecdsa   - Faster, smaller keys (curve size set by sshKeyLength: 256/384/521)
#   ed25519 - Default and recommended (roughly RSA-4096 strength, secure and fast)
#   ed448   - Extra-strong (roughly RSA-8192 strength, slower and less widely supported)
sshKeyType=ed25519
#Bit length (rsa) or curve size (ecdsa) for generated keys - ignored for ed25519/ed448, which
#always use a fixed size regardless of this value. Typical values: 4096 for rsa, 521 for
#ecdsa (P-521 curve).
sshKeyLength=256
#Default key type offered to a user generating their own personal key (see
#allowUserKeyTypeSelection below) - same valid values as sshKeyType above.
defaultUserKeyType=ed25519
#If true, a user generating their own personal key can pick its type instead of always
#getting defaultUserKeyType above.
allowUserKeyTypeSelection=false
#Import a specific private/public key pair for the application SSH key instead of letting
#Bastillion generate one - only read when resetApplicationSSHKey above triggers a
#(re)generation. Leave both blank to auto-generate instead (the normal case).
privateKey=
publicKey=
#Passphrase for the application SSH key pair. ${randomPassphrase} (the default) generates a
#random one when the key is created; leave this literally blank for a key with no passphrase
#at all, or set your own fixed passphrase (required if you're supplying privateKey above and
#that key already has one).
defaultSSHPassphrase=${randomPassphrase}

### Auditing ###
#Store terminal output in the database so sessions can be replayed from Audit Sessions.
enableInternalAudit=true
#Number of days of audit history to keep - anything older is deleted on the next cleanup
#pass. Unlike similar-looking settings below, this has no "disable" value: setting this to 0
#or a negative number does NOT turn cleanup off, it makes the cutoff today (or later), which
#deletes nearly all existing history the next time cleanup runs. To keep history indefinitely,
#set this to a very large number instead.
deleteAuditLogAfter=90

### Sessions and Connections ###
#Seconds the SSH client waits before sending a null "keepalive" packet to the remote server,
#so idle terminal sessions don't get dropped by a firewall/NAT in between.
serverAliveInterval=60
#Idle timeout in minutes for an open terminal WebSocket connection. Set to <=0 for no timeout.
websocketTimeout=0
#The application session's own timeout (login expiry) in minutes, refreshed on every
#authenticated request - a session goes idle-expired only after this many minutes with no
#activity at all.
sessionTimeout=15

### Access Control ###
#Two-factor authentication (TOTP) requirement for local/LDAP logins - 'required' (every user
#must enroll), 'optional' (enrollment offered but not enforced), or 'disabled' (turned off
#entirely, no enrollment UI shown). Note: SAML SSO logins skip this check regardless of this
#setting - see the SAML section below.
oneTimePassword=optional
#Set to false to disable Bastillion's centralized key management: with it on (the default),
#registering a system appends Bastillion's application public key to that system's
#authorized_keys file so every Bastillion user authenticates through one shared, centrally
#revocable key. With it off, Bastillion instead overwrites authorized_keys completely with
#whatever public key each user has on file - no shared key, no central revocation.
keyManagementEnabled=true

#How Bastillion verifies the SSH host key each managed system presents. Without this, the
#key a host offers is never compared against anything, so anything answering on a managed
#system's address is handed the application private key - and, on authentication fallback,
#the connecting user's password or key passphrase.
#  accept-new : record and trust each host's key the first time it is seen, then refuse to
#               connect if that host ever presents a different one (default; needs no action
#               when upgrading an existing install)
#  strict     : as accept-new, but a newly seen host key must also be approved by a manager
#               on Manage -> Host Keys before the first connection to that host is allowed
#  off        : no host key verification at all (the behavior before 5.2.2)
#Review, approve and revoke recorded keys under Manage -> Host Keys.
hostKeyVerification=accept-new

### HTTP Strict Transport Security ###
#How long (in seconds) a browser should refuse to reach this site over plain HTTP after
#seeing it once over HTTPS. One year by default.
hstsMaxAge=31536000
#Extend the above to every subdomain of the host serving Bastillion. Stronger, but not a
#reversible mistake - a browser that has cached it refuses plain HTTP to those names for the
#whole hstsMaxAge. Safe and worth enabling on a dedicated host (bastillion.example.com);
#leave false if Bastillion is served from an apex domain whose other subdomains are not all
#HTTPS.
hstsIncludeSubDomains=false
#Also request that this host be preloaded into browsers' built-in HSTS lists. Requires
#hstsIncludeSubDomains=true (and submitting the host at hstspreload.org); ignored otherwise.
#Hardest of all to undo - removal from the preload list takes months to reach users.
hstsPreload=false
#Governs how a user's personal SSH key gets set. If true, Bastillion always generates the key
#itself (never accepts a user-supplied public key) and enforces a strong passphrase on it. If
#false, users may instead paste in their own existing public key.
forceUserKeyGeneration=true
#How often (in minutes) Bastillion re-pushes authorized_keys to every registered system, so
#key/profile changes propagate without waiting for the next manual action. Set to <=0 to
#disable automatic refresh (changes still take effect on the next manual push).
authKeysRefreshInterval=120
#Regular expression new local passwords must match.
passwordComplexityRegEx=((?=.*\\d)(?=.*[A-Z])(?=.*[a-z])(?=.*[!@#$%^&*()_=\\[\\]{};':"\\\\|,.<>\\/?+-]).{8,20})
#Error message shown when a password fails passwordComplexityRegEx above - keep this in sync
#with whatever the regex actually requires.
passwordComplexityMsg=Passwords must be 8 to 20 characters, contain one digit, one lowercase, one uppercase, and one special character
#Automatically expire a local/LDAP/SAML user's account after this many days of no login
#activity (they can no longer log in until a manager clears the expiration). Set to <=0 to
#disable expiration entirely.
accountExpirationDays=-1
#Max failed login attempts allowed per client IP within loginThrottleWindowMinutes below
#before further attempts from that IP are refused until the window resets. Deliberately keyed
#by client IP, not by username, so a per-account lockout can't be used to remotely lock out a
#known admin username.
maxLoginAttemptsPerIP=10
#Sliding window (in minutes) used to count failed login attempts per client IP for the
#throttle above.
loginThrottleWindowMinutes=5
#Maximum number of client IPs the login throttle tracks at once. Reached only when more than
#this many distinct addresses fail to log in inside one window; the oldest entry is then
#dropped to make room, so the throttle cannot be filled up to disable it.
maxThrottledIPs=20000
#HTTP header to trust for the client's IP address (ex: X-Forwarded-For), used for the login
#throttle above and for audit logging. Leave blank (the default) to use the raw TCP
#connection's address instead. Only set this if Bastillion sits behind a reverse proxy that
#overwrites this header itself - trusting a client-suppliable header without one lets a
#remote attacker spoof any IP and bypass the throttle entirely.
clientIPHeader=

### External Authentication - LDAP / JAAS ###
#Enables LDAP login when set to a module name defined in jaas.conf (ex: ldap-ol, ldap-ad).
#Leave blank to disable. See jaas.conf for the LDAP connection details for that module.
jaasModule=
#Profile automatically assigned to every authenticated LDAP user, in addition to any
#profile whose name matches one of that user's LDAP roles. Leave blank for none - without it,
#a user whose roles match no Bastillion profile by name is rejected at login (unless they're
#a Manager, which isn't profile-scoped).
defaultProfileForLdap=

### External Authentication - SAML 2.0 SSO (Entra ID, Okta, ADFS, or any SAML 2.0 IdP) ###
#Bastillion's own externally-reachable base URL (ex: https://bastillion.example.com), with
#no trailing slash. Required to enable SAML - used to build both the default SP entity ID
#and the fixed <samlBaseUrl>/saml/acs callback URL to register as the IdP's Reply URL/ACS URL.
samlBaseUrl=
#Identity provider metadata URL - the preferred way to configure the IdP, since it supplies
#the IdP's entity ID, SSO URL, and signing certificate in one fetch (ex: Entra ID's "App
#Federation Metadata Url"). Setting this (or samlIdpSsoUrl below) enables SAML - leave both
#blank to disable.
samlIdpMetadataUrl=
#Manual IdP configuration, used only when samlIdpMetadataUrl above is left blank or
#unreachable. All three are required together in that case.
samlIdpEntityId=
samlIdpSsoUrl=
samlIdpCert=
#Overrides the SP entity ID Bastillion presents to the IdP, if it must differ from
#samlBaseUrl above (which is the default). Set this to match exactly what's registered as
#the Identifier/Entity ID on the IdP side.
samlSpEntityId=
#Assertion attribute (claim URI) carrying the user's group/role membership. Mapped to
#Bastillion profiles the same way LDAP roles are: a claim value that matches a Bastillion
#profile name adds the user to that profile. Defaults to Entra ID's group claim URI - change
#for a different IdP or an app-roles-based setup (Entra's "roles" claim, etc.).
samlRoleAttribute=http://schemas.microsoft.com/ws/2008/06/identity/claims/groups
#Profile automatically assigned to every authenticated SAML user, in addition to any
#profile whose name matches one of that user's assertion role/group claim values. Leave
#blank for none - without it, a user whose claims match no Bastillion profile by name will
#be rejected at login (unless they're a Manager, which isn't profile-scoped).
defaultProfileForSaml=
#Require the IdP to send encrypted assertions - off by default. Only turn this on if your IdP
#is actually configured to encrypt assertions for Bastillion's SP certificate (see
#samlSpKeystorePath below); if it isn't, every login will fail once this is true. Signing
#Bastillion's own outgoing AuthnRequests, by contrast, is always on automatically and needs
#no setting here - it's harmless whether or not the IdP checks it.
samlWantEncryptedAssertions=false
#Bastillion's own SAML SP signing/encryption key pair. Auto-generated (self-signed) the first
#time it's needed and reused after that - leave both blank for this, the normal case. Fetch
#/saml/metadata to get the resulting certificate to hand to your IdP admin, if your IdP should
#verify signed requests or encrypt assertions for Bastillion. Set these two only to use a
#real (e.g. CA-issued) key pair instead of the auto-generated one.
samlSpKeystorePath=
samlSpKeystorePassword=

### Licensing ###
#License key issued by licensing/LicenseGenerator.java. Leave blank to run unlicensed,
#capped at LicenseUtil.FREE_TIER_MAX_SYSTEMS registered systems.
#Can also be supplied via the LICENSE_KEY environment variable instead (takes precedence
#over this file - handy for containers/secrets managers).
licenseKey=

### Database and Connection Pool ###
#Database user.
dbUser=bastillion
#Database password. Generated randomly (and encrypted in place) on first boot if left blank -
#see DBInitServlet.
dbPassword=
#Database JDBC driver class.
dbDriver=org.h2.Driver
#JDBC connection URL for the database.
dbConnectionURL=jdbc:h2:file:keydb/bastillion;CIPHER=AES;
#Max connections allowed in the connection pool.
maxActive=25
#When true, a pooled connection is validated (a lightweight test query) before being handed
#out, so a connection that died while idle in the pool doesn't surface as an error later.
testOnBorrow=true
#Minimum number of idle connections the pool keeps ready before it needs to spawn new ones.
minIdle=2
#Max time (in milliseconds) to block waiting for a connection before throwing an exception
#once the pool is exhausted (maxActive connections all in use).
maxWait=15000
